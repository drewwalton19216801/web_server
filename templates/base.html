<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}My Website{% endblock title %}</title>
    <link rel="stylesheet" href="/static/styles.css">
    <style>
        :root {
            --primary-color: #60a5fa;
            --primary-hover: #3b82f6;
            --text-color: #f3f4f6;
            --text-light: #d1d5db;
            --bg-color: #111827;
            --nav-bg: #1f2937;
            --border-color: #374151;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.3);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.4);
            --transition: all 0.2s ease-in-out;
            --card-bg: #1f2937;
            --nav-blur-bg: rgba(31, 41, 55, 0.9);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            line-height: 1.6;
            color: var(--text-color);
            background-color: var(--bg-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 1rem;
        }

        nav {
            background: var(--nav-bg);
            padding: 1rem 0;
            box-shadow: var(--shadow-sm);
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(8px);
            background-color: var(--nav-blur-bg);
        }

        .nav-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 1rem;
        }

        .nav-brand {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary-color);
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            gap: 1.5rem;
        }

        nav a {
            text-decoration: none;
            color: var(--text-color);
            font-weight: 500;
            padding: 0.5rem 1rem;
            border-radius: 0.375rem;
            transition: var(--transition);
        }

        nav a:hover {
            color: var(--primary-color);
            background-color: rgba(96, 165, 250, 0.1);
        }

        main {
            flex: 1;
            padding: 2rem 0;
        }

        .content-wrapper {
            max-width: 800px;
            margin: 0 auto;
            padding: 0 1rem;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 1.5rem;
            line-height: 1.2;
            background: linear-gradient(to right, var(--primary-color), #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            margin-bottom: 1rem;
            color: var(--text-light);
        }

        .current-time {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.1em;
            color: var(--primary-color);
            background-color: rgba(96, 165, 250, 0.1);
            padding: 0.25rem 0.75rem;
            border-radius: 0.375rem;
            display: inline-block;
            transition: var(--transition);
        }

        .card {
            background: var(--card-bg);
            border-radius: 0.5rem;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-color);
            transition: var(--transition);
        }

        .card:hover {
            box-shadow: var(--shadow-md);
            transform: translateY(-2px);
            border-color: var(--primary-color);
        }

        ul {
            list-style: none;
            padding: 0;
        }

        li {
            margin-bottom: 0.75rem;
            padding-left: 1.5rem;
            position: relative;
            color: var(--text-light);
        }

        li::before {
            content: "→";
            position: absolute;
            left: 0;
            color: var(--primary-color);
        }

        @media (max-width: 640px) {
            .nav-container {
                flex-direction: column;
                gap: 1rem;
            }

            .nav-links {
                width: 100%;
                justify-content: center;
            }

            h1 {
                font-size: 2rem;
            }
        }
    </style>
    <script>
        async function updateTime() {
            try {
                const response = await fetch('/api/time');
                const data = await response.json();
                const timeElements = document.querySelectorAll('.current-time');
                timeElements.forEach(element => {
                    element.textContent = data.current_time;
                });
            } catch (error) {
                console.error('Error fetching time:', error);
            }
        }

        // Update time immediately and then every second
        updateTime();
        setInterval(updateTime, 1000);
    </script>
</head>
<body>
    <nav>
        <div class="nav-container">
            <a href="/" class="nav-brand">My Website</a>
            <div class="nav-links">
                <a href="/" class="{% if current_page == 'home' %}active{% endif %}">Home</a>
                <a href="/about" class="{% if current_page == 'about' %}active{% endif %}">About</a>
            </div>
        </div>
    </nav>
    
    <main>
        <div class="content-wrapper">
            {% block content %}{% endblock content %}
        </div>
    </main>
</body>
</html>

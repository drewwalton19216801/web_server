<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}My Website{% endblock title %}</title>
    <link rel="stylesheet" href="/static/styles.css">
    <script>
        // Fetch and display render time for developers
        fetch('/api/time')
            .then(response => response.json())
            .then(time => {
                const renderTime = document.getElementById('render-time');
                if (renderTime) {
                    renderTime.textContent = `Page rendered at: ${time}`;
                }
            })
            .catch(console.error);
    </script>
</head>
<body>
    <nav>
        <div class="nav-container">
            <a href="/" class="nav-brand">My Website</a>
            <div class="nav-links">
                <a href="/" class="{% if current_page == 'blog' %}active{% endif %}">Blog</a>
                <a href="/about" class="{% if current_page == 'about' %}active{% endif %}">About</a>
            </div>
        </div>
    </nav>
    
    <main>
        <div class="content-wrapper">
            {% block content %}{% endblock content %}
        </div>
    </main>

    <!-- Developer info - only visible when inspecting -->
    <div id="render-time" style="display: none;" aria-hidden="true"></div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}My Website{% endblock title %}</title>
    <link rel="stylesheet" href="/static/styles.css">
    <script>
        // Fetch and display render time for developers
        fetch('/api/time')
            .then(response => response.json())
            .then(time => {
                const renderTime = document.getElementById('render-time');
                if (renderTime) {
                    renderTime.textContent = `Page rendered at: ${time}`;
                }
            })
            .catch(console.error);
    </script>
</head>
<body>
    <nav>
        <div class="nav-container">
            <a href="/" class="nav-brand">My Website</a>
            <div class="nav-links">
                <a href="/" class="{% if current_page == 'blog' %}active{% endif %}">Blog</a>
                <a href="/about" class="{% if current_page == 'about' %}active{% endif %}">About</a>
                <div class="search-dropdown">
                    <button class="search-toggle">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="11" cy="11" r="8"></circle>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                        </svg>
                    </button>
                    <div class="search-dropdown-content">
                        {% include "components/search.html" %}
                    </div>
                </div>
            </div>
        </div>
    </nav>
    
    <main>
        <div class="content-wrapper">
            {% block content %}{% endblock content %}
        </div>
    </main>

    <!-- Developer info - only visible when inspecting -->
    <div id="render-time" style="display: none;" aria-hidden="true"></div>
</body>
</html>
